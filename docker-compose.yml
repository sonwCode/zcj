services:
  app:
    build: .
    container_name: zcj-register
    ports:
      - "0.0.0.0:8001:8000"
    environment:
      DISPLAY: ":99"
      ACCOUNT_MANAGER_DATABASE_URL: "sqlite:////app/data/account_manager.db"
      # 必填：留空会让所有 /api 接口无需鉴权，因此这里强制要求设置。
      APP_PASSWORD: "${ZCJ_APP_PASSWORD:?ZCJ_APP_PASSWORD must be set}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
